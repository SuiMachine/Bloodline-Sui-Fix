[MAIN]
;The two values below are used when creating window instance (which doesn't seem to do much) and calculating aspect ratio
Width = 1920
Height = 1080
;Detours the ChangeDisplaySettings, so the game doesn't try setting screen resolution
SuppressChangeDisplaySettings = 1
;Detours a function that tries to create folders, but has a bug with null termination of a string, which results in garbage folders being created on th disk
TryFixGarbageFolderCreation = 1
;Detours the mouse update, so camera rotation speed no longer depends on framerate (at 60 FPS behaves identically to the original)
FixCameraRotationSpeed = 1
;Requires FixCameraRotationSpeed. Adjusts sensitivity of mouse input.
MouseSensitivity = 1.0
;Detours input to allow for better handling on focus loss. Otherwise the game will try to steal focus each cycle. 
AllowAltTab = 1
;Detours a function responsible for finding assets to build a local cache of paths, speeding up loads
CacheResourceLoading = 1
;Adjusts the final output gamma as post process. This can be changed in game using Shift+'+' and Shift+'-' keys.
Gamma =1.0
;In case another DLL needs to be loaded (like dinput8 wrapper)
LoadDll=

;Other stuff - mostly debugging stuff
;Enables tracing of cache loading.
CacheResourceLoadingTrace = 0
;This is just for debugging camera rotation issues. It outputs the rotation and mouse movement to log file. You probably don't need it
FixCameraRotationSpeedTrace = 0
